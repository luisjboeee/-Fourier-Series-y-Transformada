<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Generador de ondas – Series de Fourier</title>
<style>
/* ===== 1. ESTILOS ===== */
:root{--bg:#0c0d14;--panel:#151726;--line:#262a45;--txt:#e8eaff;--mut:#8b90b8;--blue:#2f6bff;--vio:#9b5cff;--ok:#3be0a4}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(1000px 500px at 80% -10%,#1b1a40,transparent),var(--bg);color:var(--txt);font-family:"Trebuchet MS","Segoe UI",sans-serif;padding:16px}
h1{font-size:clamp(1.2rem,3vw,1.8rem);margin:0 0 14px;letter-spacing:.5px}
h1 span{color:var(--vio)}
.grid{display:grid;grid-template-columns:340px 1fr;gap:14px;max-width:1300px;margin:auto}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
.panel h2{font-size:.95rem;margin:0 0 10px;color:var(--mut);font-weight:600}
label{display:block;font-size:.85rem;color:var(--mut);margin:8px 0 4px}
select,input[type=number]{width:100%;background:#0c0d14;color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:9px;font-size:1rem}
select:focus,input:focus,button:focus-visible,.knob:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.knobs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.knobbox{text-align:center}
.knob{width:100%;max-width:130px;aspect-ratio:1;touch-action:none;cursor:grab;display:block;margin:auto;border-radius:50%}
.knob:active{cursor:grabbing}
.kval{font-size:1.15rem;font-weight:700;color:var(--txt);margin-top:2px}
.btns{display:flex;gap:8px;margin-top:14px}
button{flex:1;padding:11px 6px;border:1px solid var(--line);border-radius:8px;background:#0c0d14;color:var(--txt);font-weight:700;cursor:pointer;font-size:.9rem}
#bPlay{background:linear-gradient(90deg,var(--blue),var(--vio));border:0}
button:hover{filter:brightness(1.2)}
.right{display:flex;flex-direction:column;gap:14px;min-width:0}
canvas#wave{width:100%;height:clamp(260px,48vh,480px);display:block;background:#08090f;border-radius:8px}
.info{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.info div{background:#0c0d14;border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.info small{color:var(--mut);display:block;font-size:.75rem}
.info b{font-size:1.05rem}
#formula{font-family:Consolas,monospace;font-size:1rem;color:var(--ok);margin-top:10px;overflow-x:auto;white-space:nowrap}
#state{color:var(--mut);font-size:.8rem;margin-top:8px}
@media(max-width:850px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<h1>GENERADOR DE ONDAS – <span>SERIES DE FOURIER</span></h1>
<div class="grid">
  <!-- ===== 2. PANEL DE CONTROLES ===== -->
  <section class="panel">
    <h2>Controles</h2>
    <label for="type">Tipo de onda</label>
    <select id="type">
      <option value="sine">Senoidal</option>
      <option value="square">Cuadrada</option>
      <option value="triangle">Triangular</option>
      <option value="saw">Diente de sierra</option>
    </select>
    <label for="harm">Armónicos (N)</label>
    <select id="harm"></select>
    <div class="knobs">
      <div class="knobbox">
        <canvas class="knob" id="kF" width="260" height="260" tabindex="0" role="slider" aria-label="Frecuencia" aria-valuemin="1" aria-valuemax="10000"></canvas>
        <div class="kval" id="fTxt">440 Hz</div>
        <label for="fIn">Frecuencia (Hz)</label>
        <input type="number" id="fIn" min="1" max="10000" step="0.1" value="440">
      </div>
      <div class="knobbox">
        <canvas class="knob" id="kA" width="260" height="260" tabindex="0" role="slider" aria-label="Amplitud" aria-valuemin="0" aria-valuemax="100"></canvas>
        <div class="kval" id="aTxt">70 %</div>
        <label for="aIn">Amplitud (%)</label>
        <input type="number" id="aIn" min="0" max="100" step="1" value="70">
      </div>
    </div>
    <div style="font-size:.75rem;color:var(--mut);margin-top:8px">Perilla: arrastra con mouse o dedo. Teclado: flechas (Shift = ajuste fino).</div>
    <div class="btns">
      <button id="bPlay">REPRODUCIR</button>
      <button id="bPause">PAUSAR</button>
      <button id="bStop">DETENER</button>
    </div>
    <div id="state">Estado: detenido</div>
  </section>

  <div class="right">
    <!-- ===== 3. GRÁFICA ===== -->
    <section class="panel"><h2>Forma de onda</h2><canvas id="wave"></canvas></section>
    <!-- ===== 4. INFORMACIÓN ===== -->
    <section class="panel">
      <h2>Información de la señal</h2>
      <div class="info">
        <div><small>Tipo de onda</small><b id="iType"></b></div>
        <div><small>Frecuencia</small><b id="iF"></b></div>
        <div><small>Amplitud</small><b id="iA"></b></div>
        <div><small>Armónicos</small><b id="iN"></b></div>
      </div>
      <div class="info" style="margin-top:10px"><div><small>Fórmula</small><div id="formula"></div></div></div>
      <div id="iUsed" style="color:var(--mut);font-size:.85rem;margin-top:8px"></div>
    </section>
  </div>
</div>

<script>
/* ===== 5. ESTADO GLOBAL ===== */
const S={type:'sine',N:5,f:440,a:70};
let phase=0,lastT=null; // fase de la animación
const NAMES={sine:'Senoidal',square:'Cuadrada',triangle:'Triangular',saw:'Diente de sierra'};
const FORM={
  sine:'f(x) = sen(x)',
  square:'f(x) = (4/π) Σ sen((2k+1)x)/(2k+1),  k=0…N-1',
  triangle:'f(x) = (8/π²) Σ (-1)^k sen((2k+1)x)/(2k+1)²,  k=0…N-1',
  saw:'f(x) = (2/π) Σ (-1)^(n+1) sen(nx)/n,  n=1…N'
};
const $=id=>document.getElementById(id);

/* ===== 6. MATEMÁTICA DE FOURIER (única fuente para gráfica y audio) ===== */
// Devuelve armónicos {n: número de armónico, c: coeficiente del seno}
function getTerms(type,N){
  const t=[];
  if(type==='sine'){ t.push({n:1,c:1}); }
  else if(type==='square'){ for(let k=0;k<N;k++){const m=2*k+1; t.push({n:m,c:(4/Math.PI)/m});} }
  else if(type==='triangle'){ for(let k=0;k<N;k++){const m=2*k+1; t.push({n:m,c:(8/(Math.PI*Math.PI))*(k%2?-1:1)/(m*m)});} }
  else { for(let n=1;n<=N;n++) t.push({n:n,c:(2/Math.PI)*(n%2?1:-1)/n}); }
  return t;
}
function evalWave(terms,x){let y=0;for(const q of terms)y+=q.c*Math.sin(q.n*x);return y;}
// Pico máximo de la serie truncada (para normalizar sin recortar; amplitud 100% = pico 1)
function peakOf(terms){let p=0;for(let i=0;i<=720;i++){p=Math.max(p,Math.abs(evalWave(terms,i/720*2*Math.PI)));}return p||1;}

/* ===== 7. PERILLAS INTERACTIVAS ===== */
function makeKnob(cv,min,max,get,set,log){
  const ctx=cv.getContext('2d'),A0=0.75*Math.PI,SW=1.5*Math.PI; // barrido de 270°
  const toFrac=v=>log?Math.log(v/min)/Math.log(max/min):(v-min)/(max-min);
  const fromFrac=p=>log?min*Math.pow(max/min,p):min+p*(max-min);
  function draw(){
    const w=cv.width,c=w/2,r=w*0.38,p=toFrac(get()),ang=A0+p*SW;
    ctx.clearRect(0,0,w,w);ctx.lineWidth=16;ctx.lineCap='round';
    ctx.strokeStyle='#262a45';ctx.beginPath();ctx.arc(c,c,r,A0,A0+SW);ctx.stroke();
    const g=ctx.createLinearGradient(0,0,w,w);g.addColorStop(0,'#2f6bff');g.addColorStop(1,'#9b5cff');
    ctx.strokeStyle=g;ctx.beginPath();ctx.arc(c,c,r,A0,ang);ctx.stroke();
    ctx.fillStyle='#0c0d14';ctx.beginPath();ctx.arc(c,c,r*0.72,0,7);ctx.fill();
    ctx.strokeStyle='#e8eaff';ctx.lineWidth=7;ctx.beginPath();
    ctx.moveTo(c+Math.cos(ang)*r*0.25,c+Math.sin(ang)*r*0.25);ctx.lineTo(c+Math.cos(ang)*r*0.62,c+Math.sin(ang)*r*0.62);ctx.stroke();
    cv.setAttribute('aria-valuenow',Math.round(get()));
  }
  let drag=false;
  function pointer(e){
    const b=cv.getBoundingClientRect();
    let a=Math.atan2(e.clientY-(b.top+b.height/2),e.clientX-(b.left+b.width/2));
    let d=a-A0;while(d<0)d+=2*Math.PI;
    let p=d/SW; if(p>1){p=(d-SW)<(2*Math.PI-d)?1:0;} // zona muerta: ajusta al extremo más cercano
    set(fromFrac(p));
  }
  cv.addEventListener('pointerdown',e=>{drag=true;cv.setPointerCapture(e.pointerId);pointer(e);});
  cv.addEventListener('pointermove',e=>{if(drag)pointer(e);});
  cv.addEventListener('pointerup',()=>drag=false);
  cv.addEventListener('pointercancel',()=>drag=false);
  cv.addEventListener('keydown',e=>{
    const dir=(e.key==='ArrowRight'||e.key==='ArrowUp')?1:(e.key==='ArrowLeft'||e.key==='ArrowDown')?-1:0;
    if(!dir)return;e.preventDefault();
    set(fromFrac(Math.min(1,Math.max(0,toFrac(get())+dir*(e.shiftKey?0.002:0.02)))));
  });
  return draw;
}

/* ===== 8. AUDIO (Web Audio API) ===== */
let ac=null,osc=null,gain=null,playing=false,paused=false;
function ensureCtx(){
  if(!ac){ac=new (window.AudioContext||window.webkitAudioContext)();gain=ac.createGain();gain.gain.value=0;gain.connect(ac.destination);}
  return ac;
}
// Construye la onda periódica con los MISMOS términos que la gráfica
function buildPeriodic(){
  const terms=getTerms(S.type,S.N),L=Math.max(...terms.map(t=>t.n))+1;
  const re=new Float32Array(L),im=new Float32Array(L);
  const pk=peakOf(terms);
  for(const t of terms)im[t.n]=t.c/pk; // normalizado a pico 1
  return ac.createPeriodicWave(re,im,{disableNormalization:true});
}
function volume(){return Math.pow(S.a/100,1.5)*0.5;} // 0–100 % → volumen (curva suave, máx. seguro 0.5)
function updateAudio(){
  if(!playing||!osc)return;
  const t=ac.currentTime;
  osc.setPeriodicWave(buildPeriodic());
  osc.frequency.setTargetAtTime(S.f,t,0.01);
  gain.gain.setTargetAtTime(volume(),t,0.02);
}
async function play(){
  ensureCtx();await ac.resume();
  if(playing&&!paused)return;
  if(paused){paused=false;gain.gain.setTargetAtTime(volume(),ac.currentTime,0.02);setState('reproduciendo');return;}
  osc=ac.createOscillator();osc.connect(gain);playing=true;
  osc.setPeriodicWave(buildPeriodic());osc.frequency.value=S.f;
  gain.gain.cancelScheduledValues(ac.currentTime);gain.gain.setValueAtTime(0,ac.currentTime);
  osc.start();gain.gain.setTargetAtTime(volume(),ac.currentTime,0.02);setState('reproduciendo');
}
function pause(){
  if(!playing||paused)return;paused=true;
  gain.gain.setTargetAtTime(0,ac.currentTime,0.02);setState('en pausa');
}
function stop(){
  if(!playing)return;
  const o=osc;gain.gain.setTargetAtTime(0,ac.currentTime,0.01);
  o.stop(ac.currentTime+0.08);osc=null;playing=false;paused=false;setState('detenido');
}
function setState(s){$('state').textContent='Estado: '+s;}

/* ===== 9. GRÁFICA (Canvas) ===== */
const cv=$('wave'),cx=cv.getContext('2d');
function drawWave(){
  const dpr=window.devicePixelRatio||1,W=cv.clientWidth,H=cv.clientHeight;
  if(cv.width!==Math.round(W*dpr)||cv.height!==Math.round(H*dpr)){cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);}
  cx.setTransform(dpr,0,0,dpr,0,0);cx.clearRect(0,0,W,H);
  const mL=52,mB=30,mT=12,mR=12,pw=W-mL-mR,ph=H-mT-mB,mid=mT+ph/2;
  // Tiempo visible: ~4 ciclos si la frecuencia lo permite (mínimo 1 ms por legibilidad no aplica: siempre 4 ciclos)
  const cycles=4,T=cycles/S.f;
  // rejilla
  cx.font='11px sans-serif';cx.fillStyle='#8b90b8';cx.strokeStyle='#1a1d33';cx.lineWidth=1;
  for(let i=0;i<=4;i++){const y=mT+ph*i/4,v=1-i/2;cx.beginPath();cx.moveTo(mL,y);cx.lineTo(mL+pw,y);cx.stroke();
    cx.textAlign='right';cx.fillText((v*100).toFixed(0)+'%',mL-6,y+4);}
  for(let i=0;i<=cycles;i++){const x=mL+pw*i/cycles;cx.beginPath();cx.moveTo(x,mT);cx.lineTo(x,mT+ph);cx.stroke();
    cx.textAlign='center';const ms=T*i/cycles*1000;cx.fillText(ms.toFixed(ms<10?2:1)+' ms',x,H-10);}
  cx.strokeStyle='#3a3f68';cx.beginPath();cx.moveTo(mL,mid);cx.lineTo(mL+pw,mid);cx.stroke();
  cx.save();cx.translate(12,mT+ph/2);cx.rotate(-Math.PI/2);cx.textAlign='center';cx.fillText('Amplitud',0,0);cx.restore();
  cx.textAlign='right';cx.fillText('Tiempo (ms)',W-mR,mT+ph-4);
  // señal (misma matemática que el audio)
  const terms=getTerms(S.type,S.N),pk=peakOf(terms),amp=S.a/100;
  const g=cx.createLinearGradient(mL,0,mL+pw,0);g.addColorStop(0,'#2f6bff');g.addColorStop(1,'#9b5cff');
  cx.strokeStyle=g;cx.lineWidth=2.5;cx.lineJoin='round';cx.beginPath();
  const pts=Math.max(600,Math.floor(pw*2));
  for(let i=0;i<=pts;i++){
    const u=i/pts,x=u*cycles*2*Math.PI-phase,y=amp*evalWave(terms,x)/pk;
    const px=mL+u*pw,py=mid-y*(ph/2);
    i?cx.lineTo(px,py):cx.moveTo(px,py);
  }
  cx.stroke();
}

/* ===== 10. ACTUALIZACIÓN GENERAL ===== */
const knobF=makeKnob($('kF'),1,10000,()=>S.f,v=>setF(v),true);
const knobA=makeKnob($('kA'),0,100,()=>S.a,v=>setA(v),false);
function clamp(v,a,b){return Math.min(b,Math.max(a,v));}
function setF(v){S.f=clamp(Math.round(v*10)/10,1,10000);refresh();}
function setA(v){S.a=clamp(Math.round(v),0,100);refresh();}
function refresh(){
  $('fTxt').textContent=S.f+' Hz';$('aTxt').textContent=S.a+' %';
  if(document.activeElement!==$('fIn'))$('fIn').value=S.f;
  if(document.activeElement!==$('aIn'))$('aIn').value=S.a;
  $('iType').textContent=NAMES[S.type];$('iF').textContent=S.f+' Hz';
  $('iA').textContent=S.a+' %';$('iN').textContent=S.type==='sine'?'No aplica (1 término)':S.N;
  $('formula').textContent=FORM[S.type];
  const t=getTerms(S.type,S.N);
  $('iUsed').textContent='Armónicos sumados: '+t.map(q=>q.n).join(', ');
  $('harm').disabled=S.type==='sine';
  knobF();knobA();drawWave();updateAudio();
}

/* ===== 11. EVENTOS ===== */
for(let i=1;i<=20;i++){const o=document.createElement('option');o.value=i;o.textContent=i;if(i===S.N)o.selected=true;$('harm').appendChild(o);}
$('type').onchange=e=>{S.type=e.target.value;refresh();};
$('harm').onchange=e=>{S.N=parseInt(e.target.value,10);refresh();};
$('fIn').oninput=e=>{const v=parseFloat(e.target.value);if(!isNaN(v)&&v>=1&&v<=10000){S.f=v;refresh();}};
$('fIn').onchange=e=>{setF(parseFloat(e.target.value)||S.f);$('fIn').value=S.f;};
$('aIn').oninput=e=>{const v=parseFloat(e.target.value);if(!isNaN(v)){setA(v);}};
$('aIn').onchange=e=>{setA(parseFloat(e.target.value)||0);$('aIn').value=S.a;};
$('bPlay').onclick=play;$('bPause').onclick=pause;$('bStop').onclick=stop;
window.addEventListener('resize',drawWave);
refresh();

/* ===== 12. ANIMACIÓN (la onda se desplaza de derecha a izquierda) ===== */
// La velocidad visual es de ~1 ciclo por segundo; se congela en PAUSA y se reanuda en REPRODUCIR
function animate(t){
  if(lastT!==null&&!paused){phase=(phase+(t-lastT)/1000*2*Math.PI*1)%(2*Math.PI);}
  lastT=t;drawWave();requestAnimationFrame(animate);
}
requestAnimationFrame(animate);
</script>
</body>
</html>
